global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      # api_version v1 is no longer supported by Prometheus 3
      api_version: v2

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      # node-exporter in this stack, plus other machines on the LAN (edit these)
      - targets: ['node-exporter:9100', '192.168.0.26:9100', '192.168.0.17:9999', '192.168.0.67:9182']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: synology
    metrics_path: /snmp
    params:
      module: [synology]
      auth: [public_v2]   # defined in snmp_exporter/snmp.yml
    static_configs:
      - targets: ['192.168.0.10']   # the NAS (edit this)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        # the exporter in this stack (it used to point at a fixed LAN address)
        replacement: snmp_exporter:9116
