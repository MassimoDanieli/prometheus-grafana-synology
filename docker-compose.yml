# Monitoring stack for a Synology NAS: Prometheus, Alertmanager, Grafana,
# node-exporter, cAdvisor and the SNMP exporter.
#
# Before the first start:
#   cp grafana/config.monitoring.example grafana/config.monitoring   # set passwords
#   edit prometheus/prometheus.yml                                   # your targets
#
# Images are pinned (they used to be :latest, which broke this stack when
# snmp_exporter, node_exporter and Prometheus changed their configuration).

volumes:
  prometheus_data: {}
  grafana_data: {}

networks:
  front-tier:
  back-tier:

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - 9090:9090
    depends_on:
      - cadvisor
      - alertmanager
    networks:
      - back-tier
    restart: always

  cadvisor:
    # Multi-arch (amd64 and arm64, Raspberry Pi included).
    image: gcr.io/cadvisor/cadvisor:v0.60.6
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 8080:8080
    networks:
      - back-tier
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.35.0
    ports:
      - 9093:9093
    volumes:
      - ./alertmanager/:/etc/alertmanager/:ro
    networks:
      - back-tier
    restart: always
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'

  grafana:
    image: grafana/grafana:13.3.1
    user: "472"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/:/etc/grafana/provisioning/:ro
    ports:
      - 3000:3000
    env_file:
      - ./grafana/config.monitoring
    networks:
      - back-tier
      - front-tier
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoring_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # was --collector.filesystem.ignored-mount-points, removed from node_exporter
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
    ports:
      - 9100:9100
    networks:
      - back-tier
    restart: always

  snmp_exporter:
    image: prom/snmp-exporter:v0.31.0
    container_name: monitoring_snmp_exporter
    restart: unless-stopped
    ports:
      - 9116:9116
    networks:
      - back-tier
    volumes:
      - ./snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
